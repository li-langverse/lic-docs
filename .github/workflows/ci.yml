# Org-required CI gate for lic-docs (docs build smoke).
# Template basis: lic/scripts/templates/github-repo/ci.yml (job name: check).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs (smoke)
        run: |
          set -euo pipefail
          chmod +x scripts/build-docs.sh
          ./scripts/build-docs.sh
          test -f site/index.html
          test -f site/CNAME
          grep -q docs.lilangverse.xyz site/CNAME
