# Org CI gate — required on every li-langverse repo default branch.
# Adapted from lic/scripts/templates/github-repo/ci.yml for MkDocs-only lic-docs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs (mkdocs gate)
        run: |
          chmod +x scripts/build-docs.sh
          ./scripts/build-docs.sh

      - name: Verify site output
        run: |
          test -d site
          test -f site/index.html
          test -f site/CNAME
